apiVersion: apps/v1
kind: Deployment
metadata:
  name: enginex-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enginex-frontend
  template:
    metadata:
      labels:
        app: enginex-frontend
    spec:
      containers:
        - name: frontend
          image: enginex-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.enginex.ai
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: enginex-frontend
spec:
  selector:
    app: enginex-frontend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enginex-frontend
spec:
  rules:
    - host: app.enginex.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enginex-frontend
                port:
                  number: 80
