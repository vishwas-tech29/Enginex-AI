name: CI - Backend

on:
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [main]
    paths:
      - "services/backend/**"

defaults:
  run:
    working-directory: services/backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: enginex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/enginex_test
      JWT_SECRET: ci-test-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app --max-line-length=100

      - name: Check formatting (black)
        run: black --check .

      - name: Check import order (isort)
        run: isort --check-only --profile black .

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --maxfail=1
